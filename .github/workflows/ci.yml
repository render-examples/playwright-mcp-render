name: CI

# This repo is a Render deploy template, not a fork that ships @playwright/mcp.
# The deploy runs the prebuilt mcr.microsoft.com/playwright/mcp image, so upstream's
# own lint and test jobs gated code this template never executes — src/, the npm
# package, and a README whose generated sections this fork replaced. They are gone.
#
# What CI gates instead is the wrapper, which is all this repo actually owns:
# Dockerfile.render, render-entrypoint.sh, and the bearer-token gate in
# render-auth-proxy.mjs. render-smoke-test.sh is the same script you run locally
# after bumping the base-image tag — see the README "Rolling Playwright MCP" section.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Ahead of the smoke test on purpose: these need no Docker build, so a broken auth
  # gate fails in seconds instead of after pulling the base image and launching Chromium.
  wrapper:
    name: Auth gate tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # No dependencies to install: the tests are node:test over the wrapper's own
      # files, which import nothing outside the standard library.
      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test the auth gate
        run: npm run test:wrapper

  smoke:
    name: Wrapper smoke test
    runs-on: ubuntu-latest
    # Pulling the base image and launching Chromium dominate, and a real failure
    # reports in ~3m — so cap this well below the default 360, which would sit
    # through a hang for six hours before calling it.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Preinstalled on GitHub's ubuntu runners, so no setup step.
      - name: Shellcheck
        run: shellcheck render-entrypoint.sh render-smoke-test.sh

      - name: Build the image and smoke-test the auth gate
        run: ./render-smoke-test.sh
